name: Generate Activity Graph

on:
  schedule:
    - cron: '0 */12 * * *'  
  workflow_dispatch:       
jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the activity graph
        uses: Ashutosh00710/github-readme-activity-graph@v2.0.7
        with:
          github_username: hazzem-web
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bg_color: '0D1117'
          color: 'C9D1D9'
          line: '00D9FF'
          point: 'FFFFFF'
          area: true
          hide_border: true
          output: 'github-contribution-grid-graph.svg'
